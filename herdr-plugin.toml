# herdr-plugin.toml — manifest for herdr-herd.
id = "herdr-herd"
name = "herdr-herd"
version = "0.1.0"
description = "A herd of pixel-art sheep for your herdr agents — one per agent."
min_herdr_version = "0.7.0"
platforms = ["linux", "macos"]

# On install, herdr runs this step. build.sh downloads the prebuilt binary for
# the platform (no Rust needed) and falls back to `cargo build --release`.
[[build]]
platforms = ["linux", "macos"]
command = ["/bin/sh", "scripts/build.sh"]

# A herd strip opened manually via `herdr plugin pane open`.
[[panes]]
id = "herd"
title = "Herd"
placement = "split"
command = ["./target/release/herdr-herd", "render"]

# Place a full-width herd strip in the current tab now (destructive rebuild).
[[actions]]
id = "place-herd"
title = "Place herd strip"
command = ["./target/release/herdr-herd", "place"]

# Start the always-on watchdog that keeps a strip in every eligible tab.
[[actions]]
id = "start-herd-controller"
title = "Start herd controller"
command = ["./target/release/herdr-herd", "control"]
