[package]
name = "herdr-herd"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "A herd of pixel-art pets for your herdr agents."
license = "MIT"
repository = "https://github.com/vandemaelefelix/herdr-herd"
keywords = ["herdr", "tui", "ratatui", "agents"]
categories = ["command-line-utilities"]

[lib]
name = "herdr_herd"
path = "src/lib.rs"

[[bin]]
name = "herdr-herd"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
insta = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
