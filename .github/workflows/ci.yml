name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.96
        run: |
          rustup toolchain install 1.96 --profile minimal --component clippy,rustfmt
          rustup default 1.96
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Test (dev-marker)
        run: cargo test --features dev-marker
